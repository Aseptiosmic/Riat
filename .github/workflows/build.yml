name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Aynı dalda art arda itişlerde eski çalışmayı iptal et
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derleme ve test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Action'lar repo politikası gereği tam SHA ile sabitlenmiştir.
      - name: Kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bileşenleri
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle kurulumu (önbellekli)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # setup-gradle v4

      - name: Birim testleri + APK derlemesi
        run: ./gradlew --stacktrace --console=plain testDebugUnitTest assembleDebug

      - name: APK'ları artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lyane-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn

      # Hata halinde: derleme günlüğünün kuyruğunu dala yaz ki
      # dışarıdan (API ile) okunabilsin. [skip ci] döngüyü keser.
      - name: Hata günlüğünü dala yaz
        if: failure()
        run: |
          git config user.name "lyane-ci"
          git config user.email "ci@lyane.local"
          mkdir -p ci
          ./gradlew --console=plain testDebugUnitTest assembleDebug > ci/build-log.txt 2>&1 || true
          tail -n 500 ci/build-log.txt > /tmp/tail.txt && mv /tmp/tail.txt ci/build-log.txt
          git add ci/build-log.txt
          git commit -m "ci: derleme günlüğü [skip ci]" || true
          git push || echo "NOT: günlük dala yazılamadı (izin yok)"

      - name: Geliştirme sürümünü yayımla
        if: success() && github.ref == 'refs/heads/arena/01a0ebd0-riat'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG=/tmp/publish.log
          ls -laR app/build/outputs/apk/ > "$LOG" 2>&1
          gh release delete dev-build --cleanup-tag -y >> "$LOG" 2>&1
          gh release create dev-build \
            app/build/outputs/apk/*/debug/*.apk \
            --title "Lyane 1.0 — geliştirme derlemesi" \
            --prerelease \
            --notes "Otomatik derleme. Yükleme: APK'yı indirin, telefonda bilinmeyen kaynaklardan kuruluma izin verip açın. Arm64 çoğu modern telefon içindir; universal tüm cihazlarda çalışır (daha büyük). Modeller uygulama içi mağazadan indirilir." \
            >> "$LOG" 2>&1
          rc=$?
          if [ $rc -ne 0 ] || ! gh release view dev-build > /dev/null 2>&1; then
            echo "RELEASE FAILED rc=$rc" >> "$LOG"
            git config user.name "lyane-ci"
            git config user.email "ci@lyane.local"
            mkdir -p ci && cp "$LOG" ci/publish-log.txt
            git add ci/publish-log.txt
            git commit -m "ci: yayım günlüğü [skip ci]" || true
            git push || true
            exit 1
          fi
